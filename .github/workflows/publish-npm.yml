name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Require tag and package versions to match
        run: |
          node -e "const p=require('./package.json'); const expected='v'+p.version; if (process.env.GITHUB_REF_NAME!==expected) { console.error('tag '+process.env.GITHUB_REF_NAME+' does not match package version '+expected); process.exit(1) }"

      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
